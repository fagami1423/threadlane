name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag created by Release Please
        required: true
        type: string
    secrets:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY:
        required: true
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD:
        required: true
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release_tag || inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Verify release tag
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "threadlane-gpui") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match threadlane-gpui version v$version"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: gpui-release-linux-${{ matrix.arch }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev cmake libclang-dev \
            libfontconfig-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxcb-randr0-dev \
            libxcb-image0-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-util-dev libvulkan-dev libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Bundle
        env:
          THREADLANE_UPDATER_PUBLIC_KEY: ${{ vars.THREADLANE_UPDATER_PUBLIC_KEY }}
        run: ./scripts/bundle-gpui-linux.sh

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: target/release/Threadlane-*-linux-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Verify release tag
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'threadlane-gpui' }).version
          if ($env:RELEASE_TAG -ne "v$version") {
            Write-Error "Tag $env:RELEASE_TAG does not match threadlane-gpui version v$version"
            exit 1
          }

      - uses: Swatinem/rust-cache@v2
        with:
          key: gpui-release-windows-x86_64

      - name: Bundle
        env:
          THREADLANE_UPDATER_PUBLIC_KEY: ${{ vars.THREADLANE_UPDATER_PUBLIC_KEY }}
        shell: pwsh
        run: ./scripts/bundle-gpui-windows.ps1

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x86_64
          path: target/release/Threadlane-*-windows-*.zip
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Verify release tag
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "threadlane-gpui") | .version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match threadlane-gpui version v$version"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: gpui-release-aarch64

      - name: Install packaging tools
        run: |
          brew install create-dmg
          cargo install --locked cargo-packager --version 0.11.8

      - name: Bundle with ad-hoc app signing
        env:
          THREADLANE_UPDATER_PUBLIC_KEY: ${{ vars.THREADLANE_UPDATER_PUBLIC_KEY }}
        run: |
          if [[ -z "$THREADLANE_UPDATER_PUBLIC_KEY" ]]; then
            echo "::error::Repository variable THREADLANE_UPDATER_PUBLIC_KEY is not configured"
            exit 1
          fi
          ./scripts/bundle-gpui-macos.sh

      - name: Sign updater archive
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" || -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::Updater signing secrets are not configured"
            exit 1
          fi
          tar -czf target/release/Threadlane.app.tar.gz -C target/release Threadlane.app
          cargo packager signer sign target/release/Threadlane.app.tar.gz

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-aarch64
          path: |
            target/release/Threadlane-*.dmg
            target/release/Threadlane-*.zip
            target/release/Threadlane.app.tar.gz
            target/release/Threadlane.app.tar.gz.sig
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate update manifest and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f artifacts/Threadlane.app.tar.gz
          test -f artifacts/Threadlane.app.tar.gz.sig
          test -n "$(find artifacts -maxdepth 1 -name 'Threadlane-*.dmg' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name 'Threadlane-*-arm64.zip' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name 'Threadlane-*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name 'Threadlane-*-linux-aarch64.tar.gz' -print -quit)"
          test -n "$(find artifacts -maxdepth 1 -name 'Threadlane-*-windows-x86_64.zip' -print -quit)"
          version="${RELEASE_TAG#v}"
          signature=$(cat artifacts/Threadlane.app.tar.gz.sig)
          notes=$(gh release view "$RELEASE_TAG" --json body --jq '.body' 2>/dev/null || printf 'Threadlane %s' "$RELEASE_TAG")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Threadlane.app.tar.gz"
          # The updater only installs into signed .app bundles, so the manifest
          # stays macOS-only even though Linux and Windows artifacts ship here.
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg url "$url" \
            --arg signature "$signature" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"macos-aarch64": {url: $url, signature: $signature, format: "app"}}}' \
            > artifacts/latest.json
          jq -e '.version and .platforms["macos-aarch64"].url and .platforms["macos-aarch64"].signature' artifacts/latest.json
          sha256sum artifacts/* > artifacts/SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Threadlane ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
