[package]
name = "threadlane-mobile"
version = "0.1.0"
edition = "2021"
description = "Thin GPUI mobile client that monitors Threadlane desktop sessions over the daemon WebSocket contract"
publish = false

[lib]
name = "threadlane_mobile"
crate-type = ["staticlib", "rlib"]

# The desktop workspace patches crates-io gpui-pre to the gpui-fast fork;
# this crate uses the published facade at the same 0.3.7 version. It stays
# its own workspace so the desktop's [patch] table does not apply here.
[workspace]

[dependencies]
# The desktop workspace patches gpui-pre to the gpui-fast fork, which
# publishes the same 0.3.7 facade — crates-io 0.3.7 keeps the mobile graph
# API-identical so ui-* crates compile unchanged on both sides.
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
# camera/video_player are unconditionally referenced by the iOS
# platform_view layer upstream — they cannot be turned off there.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245", default-features = false, features = [
    "camera",
    "deeplink",
    "video_player",
] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "201b55a431fb1b82a6047e908de63913db3d4354", default-features = false, features = [
    "component",
] }

# The wire contract shared with the desktop daemon — data types only.
threadlane-client = { path = "../../crates/threadlane-client", default-features = false }
threadlane-protocol = { path = "../../crates/threadlane-protocol" }
# The shared desktop visual language (theme registry, tokens, vendored
# icons). Its gpui-component / gpui-kit-assets deps ride the same gpui-kit
# rev pinned below so the whole graph stays on one gpui-pre.
threadlane-ui-session = { path = "../../crates/threadlane-ui-session" }
threadlane-ui-theme = { path = "../../crates/threadlane-ui-theme" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "201b55a431fb1b82a6047e908de63913db3d4354", default-features = false }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "201b55a431fb1b82a6047e908de63913db3d4354" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
url = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
