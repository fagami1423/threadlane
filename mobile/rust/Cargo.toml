[package]
name = "threadlane-mobile"
version = "0.1.0"
edition = "2021"
description = "Thin GPUI mobile client that monitors Threadlane desktop sessions over the daemon WebSocket contract"
publish = false

[lib]
name = "threadlane_mobile"
crate-type = ["staticlib", "rlib"]

# The desktop workspace pins gpui-pre 0.3.3 (gpui-fast fork); gpui-mobile
# requires gpui-pre =0.3.4. This crate is deliberately its own workspace so
# the two lockfiles cannot collide.
[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.4", default-features = false }
# camera/video_player are unconditionally referenced by the iOS
# platform_view layer upstream — they cannot be turned off there.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "0b882efdac7f524e0bb0b1d4c886b2aa752f9f20", default-features = false, features = [
    "camera",
    "deeplink",
    "video_player",
] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "7d9efcd2069f9eaa6eb3ba6345aac4aa7d87c9f7", default-features = false, features = [
    "component",
] }

# The wire contract shared with the desktop daemon — data types only.
threadlane-protocol = { path = "../../crates/threadlane-protocol" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
# Plain ws:// only: pairing traffic is LAN bearer-token transport; the
# daemon refuses non-loopback listeners without a token.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
] }
log = "0.4"
url = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
