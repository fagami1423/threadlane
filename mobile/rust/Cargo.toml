[package]
name = "threadlane-mobile"
version = "0.1.0"
edition = "2021"
description = "Thin GPUI mobile client that monitors Threadlane desktop sessions over the daemon WebSocket contract"
publish = false

[lib]
name = "threadlane_mobile"
crate-type = ["staticlib", "rlib"]

# The desktop workspace patches crates-io gpui-pre to gpui-fast's 0.3.8
# facades; this isolated mobile graph uses the matching published facade.
[workspace]

[dependencies]
# Keep the shared UI on the desktop's GPUI 0.3.8 API.
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
# camera/video_player are unconditionally referenced by the iOS
# platform_view layer upstream — they cannot be turned off there.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "2aa8f678d5bc73fd0c18585d8cd94191c78ae2da", default-features = false, features = [
    "camera",
    "deeplink",
    "video_player",
] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "134ddaa0906fbfc688255b33daef0e803a039050", default-features = false, features = [
    "component",
] }

# The wire contract shared with the desktop daemon — data types only.
threadlane-client = { path = "../../crates/threadlane-client", default-features = false }
threadlane-protocol = { path = "../../crates/threadlane-protocol" }
# The shared desktop visual language (theme registry, tokens, vendored
# icons). Its gpui-component / gpui-kit-assets deps ride the same gpui-kit
# rev pinned below so the whole graph stays on one gpui-pre.
threadlane-ui-kit = { path = "../../crates/threadlane-ui-kit" }
threadlane-ui-theme = { path = "../../crates/threadlane-ui-theme" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "134ddaa0906fbfc688255b33daef0e803a039050", default-features = false }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "134ddaa0906fbfc688255b33daef0e803a039050" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
