[package]
name = "threadlane-ui-chat"
version = "0.1.0"
edition = "2021"
description = "Chat surface for the Threadlane desktop app: composer, transcript, trajectory, and context meter"

[dependencies]
threadlane-client.workspace = true
threadlane-ui-kit.workspace = true
base64.workspace = true
image.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
gpui-component.workspace = true
rfd.workspace = true
serde_json.workspace = true
threadlane-acp.workspace = true
threadlane-acp-engine.workspace = true
threadlane-coding-agent.workspace = true
threadlane-computer.workspace = true
threadlane-git.workspace = true
threadlane-permission.workspace = true
threadlane-protocol.workspace = true
threadlane-skills = { version = "0.1.0", path = "../threadlane-skills" }
threadlane-daemon.workspace = true
threadlane-ui-editor.workspace = true
threadlane-ui-mirror.workspace = true
threadlane-tools.workspace = true
threadlane-ui-state.workspace = true
threadlane-ui-theme.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
threadlane-daemon = { workspace = true, features = ["test-support"] }
threadlane-ui-state = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["full"] }
