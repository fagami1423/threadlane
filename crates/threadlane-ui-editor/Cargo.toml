[package]
name = "threadlane-ui-editor"
version = "0.1.0"
edition = "2021"
description = "File editor view for the Threadlane desktop app: multi-tab editing with save/open status"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
rfd.workspace = true
threadlane-ui-state.workspace = true
threadlane-ui-kit.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
threadlane-ui-state = { workspace = true, features = ["test-support"] }
